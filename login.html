<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login / Cadastro - Jogos Internos IFAL</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h2>Jogos Internos IFAL</h2>
  </header>

  <main style="max-width: 450px;">
    <!-- FORMULÁRIO DE LOGIN -->
    <div class="card">
      <h3>Acesso ao Sistema (Login)</h3>
      <form>
        <div class="form-group">
          <label>Usuário:</label>
          <input type="text" placeholder="Digite seu usuário (Ex: marcos)">
        </div>
        <div class="form-group">
          <label>Senha:</label>
          <input type="password" placeholder="Digite sua senha">
        </div>
        <!-- Aponta exatamente para turma.html (nome na tua imagem) -->
        <a href="turma.html" class="btn" style="width: 100%; text-align: center; box-sizing: border-box;">Entrar no Sistema</a>
      </form>
    </div>

    <!-- FORMULÁRIO DE CADASTRE-SE -->
    <div class="card">
      <h3>Ainda não tem conta? Cadastre-se</h3>
      <form>
        <div class="form-group">
          <label>Nome Completo:</label>
          <input type="text" placeholder="Ex: Professor Marcos Lima">
        </div>
        <div class="form-group">
          <label>Novo Usuário (Login):</label>
          <input type="text" placeholder="Escolha um nome de usuário">
        </div>
        <div class="form-group">
          <label>E-mail:</label>
          <input type="email" placeholder="seu.email@ifal.edu.br">
        </div>
        <div class="form-group">
          <label>Senha:</label>
          <input type="password" placeholder="Crie uma senha">
        </div>
        <div class="form-group">
          <label>Perfil de Acesso:</label>
          <select>
            <option>Professor / Comissão Organizadora</option>
            <option>Aluno Representante de Turma</option>
          </select>
        </div>
        <a href="turma.html" class="btn btn-secondary" style="width: 100%; text-align: center; box-sizing: border-box;">Criar Conta e Entrar</a>
      </form>
    </div>
  </main>
</body>
</html>
